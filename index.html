<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <meta name="theme-color" content="#141517" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="author" content="Quzzar" />
    <link rel="apple-touch-icon" sizes="180X180" href="./public/apple-icon-180.png" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta
      name="keywords"
      content="pathfinder, starfinder, ttrpg, aon 2e, rpg, character, dnd, dungeons and dragons, pf2e, sf2e, aon, aon2e, archives of nethys"
    />
    <meta
      name="description"
      content="A character builder and digital toolbox for Pathfinder and Starfinder Second Edition."
    />

    <title>Wanderer's Guide</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&family=Ubuntu+Mono&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/open-dyslexic-regular.min.css" rel="stylesheet" />
    <script>
      if (location.hostname === 'localhost' && location.port === '5194') {
        navigator.serviceWorker?.getRegistrations?.().then((registrations) => {
          registrations.forEach((registration) => registration.unregister());
        });
        window.caches?.keys?.().then((keys) => {
          keys.forEach((key) => window.caches.delete(key));
        });
      }
    </script>
  </head>
  <body>
    <div
      id="root"
      style="min-height: 100vh; background: #111827; color: #d1d5db; padding: 24px; font: 14px/1.5 system-ui, sans-serif"
    >
      Loading Wanderer's Guide...
    </div>
    <script type="module">
      const search = new URLSearchParams(location.search);
      const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
      const isAuthCallback = ['code', 'access_token', 'error', 'error_description', 'token_hash'].some(
        (key) => search.has(key) || hash.has(key)
      );
      const application = location.pathname.startsWith('/phase0')
        ? import('/src/pages/phase0/main.tsx')
        : location.pathname.startsWith('/phase1') ||
            location.pathname.startsWith('/sheet') ||
            location.pathname.startsWith('/builder') ||
            isAuthCallback
          ? import('/src/pages/phase1/main.tsx')
          : import('/src/pages/launcher/main.tsx');

      application.catch((error) => {
        const root = document.getElementById('root');
        const message = error?.stack || error?.message || String(error);

        if (root) {
          root.textContent = `Unable to start Wanderer's Guide.\n\n${message}`;
          root.style.whiteSpace = 'pre-wrap';
          root.style.color = '#fecaca';
          root.style.fontFamily = 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace';
        }

        console.error('Failed to load application entry', error);
      });
    </script>
  </body>
</html>
