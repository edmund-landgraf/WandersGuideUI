name: Monster Core 2 published pack audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/process/upload/creature-import.ts'
      - 'src/process/upload/monster-core-2-pack.ts'
      - 'src/process/upload/creature-import-audit.ts'
      - 'tactics-mcp/scripts/verify-monster-core-2-pack.ts'
      - '.github/workflows/monster-core-2-pack-audit.yml'
permissions:
  contents: read
jobs:
  published-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm ci --prefix tactics-mcp
      - name: Audit published NPCs (no database writes)
        working-directory: tactics-mcp
        run: npx --no-install tsx scripts/verify-monster-core-2-pack.ts
