name: Foundry read relay
on:
  pull_request:
    paths:
      - 'server/foundry-relay*'
      - 'server/foundry-actor-scrub.mjs'
      - 'src/process/import/foundry/**'
      - 'src/pages/phase1/FoundryImportDialog.tsx'
      - '.github/workflows/foundry-read-relay.yml'
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:foundry-relay
