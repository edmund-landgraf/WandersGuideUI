name: WGUI export catalog lifetime
on:
  pull_request:
    paths:
      - 'supabase/wgui-export/**'
      - '.github/workflows/wgui-export-memory.yml'
permissions:
  contents: read
jobs:
  export-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test supabase/wgui-export/_tests/export-queue.test.ts
