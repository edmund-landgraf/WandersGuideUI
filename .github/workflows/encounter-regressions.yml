name: Encounter regression checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tactics-mcp/**'
      - 'supabase/wgui-ext/**'
      - '.github/workflows/encounter-regressions.yml'
permissions:
  contents: read
jobs:
  encounter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CYPRESS_INSTALL_BINARY: '0'
      # Deliberately local placeholders for mocked unit tests/build. No production credentials.
      VITE_SUPABASE_URL: 'http://127.0.0.1:54321'
      VITE_SUPABASE_KEY: 'ci-local-anon-placeholder'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm ci
        working-directory: tactics-mcp
      - run: npm test
        working-directory: tactics-mcp
